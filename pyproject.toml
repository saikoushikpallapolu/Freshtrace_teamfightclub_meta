[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project"
version = "1.0.0"
description = "Produce inspection with Meta visual models, persistent batch evidence, and AWS sensor monitoring"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.28,<1",
    "python-dotenv>=1,<2",
    "pillow==13.0.0",
]

[project.optional-dependencies]
tools = [
    "pandas>=2,<4",
    "reportlab>=4,<5",
    "imageio-ffmpeg==0.7.0",
]
cloud = [
    "boto3>=1.34,<2",
    "psycopg2-binary>=2.9,<3",
    "requests>=2.31,<3",
    "aiofiles>=23,<26",
]
models = [
    "openai==2.54.0",
    "meta-sam-parser==0.1.0",
    "pillow==13.0.0",
]
dev = [
    "boto3>=1.34,<2",
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backend = ["persistence/migrations/*.py", "persistence/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
# The formatter handles code layout; prompts and generated shell scripts retain long literals.
ignore = ["E501"]
