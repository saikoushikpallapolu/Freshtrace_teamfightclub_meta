[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project"
version = "1.0.0"
description = "Real-time biochemical food spoilage intelligence, dynamic shelf-life estimation, and cold-chain audit evidence platform powered by AWS native services"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.28,<1",
    "python-dotenv>=1,<2",
    "pillow==13.0.0",
]

[project.optional-dependencies]
models = [
    "openai==2.54.0",
    "meta-sam-parser==0.1.0",
    "pillow==13.0.0",
]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backend = ["persistence/migrations/*.py", "persistence/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
